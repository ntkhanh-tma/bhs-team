name: Build & Deploy API to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: api-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write        # required for OIDC federated login to Azure

env:
  AZURE_WEBAPP_NAME: bhs-team-api
  DOTNET_VERSION: '10.0.x'

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore backend/BhsTeam.sln

      - name: Build
        run: dotnet build backend/BhsTeam.sln -c Release --no-restore

      # No test step: this solution deliberately has no test projects.

      - name: Publish
        run: >
          dotnet publish backend/src/BhsTeam.Api/BhsTeam.Api.csproj
          -c Release --no-build -o ${{ github.workspace }}/publish

      # OIDC federated credentials rather than a long-lived publish profile.
      # Configure an app registration with a federated credential scoped to this
      # repo, then set AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID.
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ github.workspace }}/publish

      - name: Azure logout
        if: always()
        run: az logout || true

# App Service configuration to set in the portal (never in the repo):
#   Connection strings:
#     Postgres              — the Neon connection string (URI or key/value form)
#   Application settings:
#     Jwt__SigningKey       — a long random value
#     Jwt__Issuer           — BhsTeam
#     Jwt__Audience         — BhsTeam
#     Cors__AllowedOrigins__0 — https://<user>.github.io
#     Database__RunMigrationsOnStartup — true (safe on a single instance)
